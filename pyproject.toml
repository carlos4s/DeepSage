[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsage"
version = "0.2.0"
description = "Gap-driven deep research agent: multi-section plans, search + crawl, cited markdown/PDF reports."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "md2pdf>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
deepsage = "deep_researcher.cli:main"

[tool.setuptools.packages.find]
include = ["deep_researcher*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
